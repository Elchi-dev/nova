[workspace]
members = [
    "crates/nova-lexer",
    "crates/nova-parser",
    "crates/nova-typechecker",
    "crates/nova-compiler",
    "crates/nova-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Elchi-dev"]
license = "MIT"
repository = "https://github.com/Elchi-dev/nova"
homepage = "https://github.com/Elchi-dev/nova"
readme = "README.md"

[workspace.dependencies]
# Lexer
logos = "0.14"
# Parser
chumsky = "0.9"
# CLI
clap = { version = "4", features = ["derive"] }
# Error reporting
miette = { version = "7", features = ["fancy"] }
ariadne = "0.4"
# Utilities
thiserror = "1"
anyhow = "1"
# Serialization (for dist/modules)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Colored output
colored = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
